{% extends 'base.html' %}

{% block title %}Оформлення оплати{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="mb-0 fw-bold">Вибір способу оплати</h5>
            </div>
            <div class="card-body p-4">
                <p class="fs-5">Ви оплачуєте замовлення на суму: <strong class="text-primary">{{ order.total_price }} грн</strong></p>
                
                <hr>

                <form action="{% url 'checkout_session' %}" method="POST">
                    {% csrf_token %}
                    
                    <input type="hidden" name="order_id" value="{{ order.id }}">
                    
                    <div class="form-check p-3 border rounded mb-3 bg-light">
                        <input class="form-check-input ms-1" type="radio" name="payment_method" id="stripe" value="stripe" checked>
                        <label class="form-check-label ms-3 fw-bold" for="stripe">
                            💳 Кредитна або дебетова картка (Stripe)
                        </label>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold py-3 mt-2">
                        Перейти до захищеної оплати
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
