<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Книжковий Магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .content-wrapper {
            flex: 1 0 auto;
        }
        footer {
            flex-shrink: 0;
        }
    </style>
</head>
<body class="bg-light">

    <div class="content-wrapper">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" href="{% url 'books_list' %}">📚 BookStore</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'books_list' %}active fw-bold{% endif %}" 
                               href="{% url 'books_list' %}">Книги</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'categories_list' %}active fw-bold{% endif %}" 
                               href="{% url 'categories_list' %}">Категорії</a>
                        </li>
                         <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'orders_list' %}active fw-bold{% endif %}" 
                               href="{% url 'orders_list' %}">Замовлення</a>
                        </li>
                    </ul>
                    
                    <div class="d-flex align-items-center gap-3">
                        <a href="{% url 'cart_detail' %}" class="btn btn-outline-light btn-sm position-relative">
                            🛒 Кошик
                            <span id="header-cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                {{ request.session.cart|length|default:0 }}
                            </span>
                        </a>

                        <a href="{% url 'book_create' %}" class="btn btn-success btn-sm">Додати книгу</a>
                        <a href="{% url 'category_add' %}" class="btn btn-outline-light btn-sm">Додати категорію</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container mb-5">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <footer class="bg-dark text-white-50 py-4 mt-auto border-top border-secondary">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                    <span class="text-white fw-bold fs-5">📚 BookStore</span>
                    <p class="mb-0 small mt-1">&copy; 2026 Усі права захищені. Навчальний проєкт Django.</p>
                </div>
            </div>
        </div>
    </footer>

    <style>
        .hover-white:hover {
            color: #fff !important;
            transition: color 0.2s ease-in-out;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    function cartAction(url, bookId, actionType) {
        fetch(url, {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                if (actionType === 'add_from_catalog') {
                
                    alert(data.message || 'Книгу додано!');
                }
                
                window.location.reload(); 
            }
        })
        .catch(error => console.error('Помилка:', error));
    }
    </script>
</body>
</html>
