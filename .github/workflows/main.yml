name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- PROJECT A (Bookshop) ---
      - name: Install dependencies (Project A)
        working-directory: HW6/bookshop
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov pytest-django
          pip install -r requirements.txt

      - name: Lint with Flake8 (Project A)
        working-directory: HW6/bookshop
        run: |
          flake8 .

      - name: Run Tests (Project A)
        working-directory: HW6/bookshop
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          DB_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: django-insecure-ci-test-key
          STRIPE_CLIENT_API: sk_test_placeholder_key_for_tests
        run: |
          pytest --cov=. --cov-report=xml

      # --- PROJECT B (Warehouse) ---
      - name: Install dependencies (Project B)
        working-directory: ProjectB
        run: |
          pip install -r requirements.txt

      - name: Lint with Flake8 (Project B)
        working-directory: ProjectB
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run Tests (Project B)
        working-directory: ProjectB
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          DB_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: django-insecure-ci-test-key
        run: |
          python manage.py test